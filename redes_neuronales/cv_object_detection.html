<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Detección de Objetos - TF.js</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --neon-color: #00ffcc;
            --bg-color: #121212;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Hide scrollbars for AR feel */
        }

        header {
            position: absolute;
            top: 0;
            width: 100%;
            background: rgba(44, 62, 80, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px var(--neon-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
            text-shadow: 0 0 5px var(--neon-color);
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through if needed */
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 15px;
            border: 1px solid var(--neon-color);
            box-shadow: 0 0 20px var(--neon-color);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--neon-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* UI Overlays for AR feel */
        .ar-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-left: 3px solid var(--neon-color);
            font-size: 0.9em;
        }

        .ar-hud p {
            margin: 5px 0;
            font-family: monospace;
            color: var(--neon-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="back-btn">← Volver</a>
        <h1><i class="fas fa-vr-cardboard"></i> AR Object Detection</h1>
        <div style="width: 80px;"></div> <!-- Spacer for flex balance -->
    </header>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="loading">
            <div class="spinner"></div>
            <h2 id="status-text">Cargando Modelo Neural...</h2>
            <p style="font-size: 0.8em; color: #ccc;">Puede tomar unos segundos (aprox 2MB)</p>
        </div>

        <div class="ar-hud">
            <p>STATUS: <span id="hud-status">INICIALIZANDO</span></p>
            <p>FPS: <span id="hud-fps">0</span></p>
            <p>OBJETOS: <span id="hud-objects">0</span></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingDiv = document.getElementById('loading');
        const statusText = document.getElementById('status-text');
        
        const hudStatus = document.getElementById('hud-status');
        const hudFps = document.getElementById('hud-fps');
        const hudObjects = document.getElementById('hud-objects');

        let model;
        let lastTime = 0;
        let frameCount = 0;
        let lastFpsTime = 0;

        // Setup Webcam
        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('La API del navegador no soporta cámara web.');
            }
            
            statusText.innerText = "Accediendo a la cámara...";
            
            const stream = await navigator.mediaDevices.getUserMedia({
                'audio': false,
                'video': {
                    facingMode: 'environment' // Prefer rear camera on mobile
                }
            });
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
        }

        // Detect Objects
        async function detectFrame() {
            if (video.readyState < 2) {
                requestAnimationFrame(detectFrame);
                return;
            }

            // Sync canvas size with video size to match exactly the layout
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            if (canvas.width !== videoWidth || canvas.height !== videoHeight) {
                canvas.width = videoWidth;
                canvas.height = videoHeight;
                // Also scale canvas via CSS to match video's object-fit cover
                canvas.style.width = video.clientWidth + "px";
                canvas.style.height = video.clientHeight + "px";
            }

            // Get predictions
            const predictions = await model.detect(video);
            
            hudObjects.innerText = predictions.length;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                
                // We use native video dimensions because model.detect gives coords in native video coords
                const scaledX = x;
                const scaledY = y;
                const scaledWidth = width;
                const scaledHeight = height;

                // AR Bounding Box styling
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                
                // Draw glow
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 10;
                
                // Draw Box
                ctx.strokeRect(scaledX, scaledY, scaledWidth, scaledHeight);
                
                // Draw Corner Accents (Sci-Fi AR look)
                const cornerLength = 20;
                ctx.lineWidth = 5;
                
                // Top Left
                ctx.beginPath(); ctx.moveTo(scaledX, scaledY + cornerLength); ctx.lineTo(scaledX, scaledY); ctx.lineTo(scaledX + cornerLength, scaledY); ctx.stroke();
                // Top Right
                ctx.beginPath(); ctx.moveTo(scaledX + scaledWidth - cornerLength, scaledY); ctx.lineTo(scaledX + scaledWidth, scaledY); ctx.lineTo(scaledX + scaledWidth, scaledY + cornerLength); ctx.stroke();
                // Bottom Left
                ctx.beginPath(); ctx.moveTo(scaledX, scaledY + scaledHeight - cornerLength); ctx.lineTo(scaledX, scaledY + scaledHeight); ctx.lineTo(scaledX + cornerLength, scaledY + scaledHeight); ctx.stroke();
                // Bottom Right
                ctx.beginPath(); ctx.moveTo(scaledX + scaledWidth, scaledY + scaledHeight - cornerLength); ctx.lineTo(scaledX + scaledWidth, scaledY + scaledHeight); ctx.lineTo(scaledX + scaledWidth - cornerLength, scaledY + scaledHeight); ctx.stroke();

                // Draw Label Background
                ctx.fillStyle = 'rgba(0, 255, 204, 0.8)';
                ctx.shadowBlur = 0; // Turn off glow for text bg
                const label = `${prediction.class.toUpperCase()} ${Math.round(prediction.score * 100)}%`;
                
                ctx.font = 'bold 18px monospace';
                const textWidth = ctx.measureText(label).width;
                ctx.fillRect(scaledX, scaledY - 25, textWidth + 10, 25);

                // Draw Text
                ctx.fillStyle = '#000000';
                ctx.fillText(label, scaledX + 5, scaledY - 7);
            });

            // Calculate FPS
            const now = performance.now();
            frameCount++;
            if (now - lastFpsTime >= 1000) {
                hudFps.innerText = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            requestAnimationFrame(detectFrame);
        }

        // Main function
        async function main() {
            try {
                // Load Model
                model = await cocoSsd.load();
                console.log("Model loaded.");
                
                // Setup Camera
                await setupCamera();
                video.play();
                console.log("Camera ready.");
                
                // Start UI
                loadingDiv.style.display = 'none';
                hudStatus.innerText = "ONLINE";
                hudStatus.style.color = "#00ffcc";
                
                lastFpsTime = performance.now();
                detectFrame();

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                document.querySelector('.spinner').style.display = 'none';
                hudStatus.innerText = "ERROR";
                hudStatus.style.color = "red";
            }
        }

        // Start everything
        main();
    </script>
</body>
</html>
